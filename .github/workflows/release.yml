name: Release

# Push a tag like v0.1.0 to build desktop binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          dir="onze-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp README.md LICENSE-APACHE "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/onze.exe" "$dir/"
            7z a "$dir.zip" "$dir" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/onze" "$dir/"
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            onze-*.tar.gz
            onze-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          cat > notes.md <<EOF
          ## Download

          | System | File |
          |---|---|
          | Windows (64-bit) | [onze-$tag-windows-x86_64.zip]($base/onze-$tag-windows-x86_64.zip) |
          | macOS (Apple Silicon: M1 and later) | [onze-$tag-macos-apple-silicon.tar.gz]($base/onze-$tag-macos-apple-silicon.tar.gz) |
          | macOS (Intel) | [onze-$tag-macos-intel.tar.gz]($base/onze-$tag-macos-intel.tar.gz) |
          | Linux (x86_64) | [onze-$tag-linux-x86_64.tar.gz]($base/onze-$tag-linux-x86_64.tar.gz) |

          Or use it in the browser: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/

          The builds are not code-signed. See the [README](https://github.com/$GITHUB_REPOSITORY#download) for the one-time step on first launch.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Onze $tag" --notes-file notes.md \
            "onze-$tag-windows-x86_64.zip#Windows (64-bit)" \
            "onze-$tag-macos-apple-silicon.tar.gz#macOS (Apple Silicon)" \
            "onze-$tag-macos-intel.tar.gz#macOS (Intel)" \
            "onze-$tag-linux-x86_64.tar.gz#Linux (x86_64)"
